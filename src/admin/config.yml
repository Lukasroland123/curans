# =====================================================================
#  Redigeringssystem for Curans
#
#  DENNE FIL ER GENERERET. Ret den ikke i hånden - kør i stedet
#      python scripts/lav-cms-config.py
#  og ret etiketterne i det script. Ellers forsvinder rettelsen næste
#  gang, nogen kører scriptet.
# =====================================================================

backend:
  name: github
  repo: Lukasroland123/curans
  branch: main

  # Login gaar gennem vores egen Cloudflare Worker (sveltia-cms-auth),
  # den samme som soestersitet bruger. HUSK at tilfoeje curans.dk og
  # www.curans.dk til ALLOWED_DOMAINS i Workeren - den matcher ikke
  # underdomaener, og uden dem doer login uden en fejlbesked.
  base_url: https://sveltia-cms-auth.lukas-rs-arbejde.workers.dev

  commit_messages:
    update: "Rettet {{collection}} · {{author-name}}"
    uploadMedia: "Nyt billede: {{path}}"
    deleteMedia: "Slettet billede: {{path}}"

media_folder: "src/billeder"
public_folder: "/billeder"

collections:
  - name: sider
    label: "Sider"
    files:

      - name: forside
        label: "Forside"
        file: "src/_data/forside.json"
        description: "Den første side, folk lander på."
        fields:
          - { name: titel, label: "Sidens titel i Google (ses ikke på siden)", widget: string }
          - { name: beskrivelse, label: "Sidens beskrivelse i Google (ses ikke på siden)", widget: text }
          - { name: hero_mikrotekst, label: "Øverst på siden · Lille tekst over overskriften", widget: string }
          - { name: hero_overskrift, label: "Øverst på siden · Overskrift", widget: string }
          - { name: hero_tekst, label: "Øverst på siden · Tekst", widget: text }
          - { name: svar, label: "Det korte svar (den grå boks øverst)", widget: text }
          - name: hero_maerkater
            label: "De små mærkater under knapperne"
            widget: list
            allow_add: false
            allow_remove: false
            fields:
              - { name: tekst, label: "Tekst", widget: string }
          - { name: hero_billede, label: "Øverst på siden · Billede", widget: image }
          - { name: hero_billede_alt, label: "Øverst på siden · Hvad ser man på billedet?", widget: string, hint: "Læses højt for blinde og bruges af Google i stedet for billedet. Beskriv hvad man SER, ikke stemningen." }
          - { name: hero_billedtekst, label: "Øverst på siden · Billedtekst (vises under billedet)", widget: string, hint: "Den kursive tekst under billedet. Lad feltet stå tomt, hvis der ingen tekst skal være." }
          - { name: ydelser_overskrift, label: "Ydelseskortene · Overskrift", widget: string }
          - { name: ydelser_intro, label: "Ydelseskortene · Introtekst", widget: text }
          - name: ydelser_kort
            label: "De fem kort med ydelser"
            widget: list
            allow_add: false
            allow_remove: false
            fields:
              - { name: overskrift, label: "Overskrift", widget: string }
              - { name: underrubrik, label: "Underrubrik", widget: string }
              - { name: tekst, label: "Tekst", widget: text }
              - { name: url, label: "Url", widget: string }
          - { name: udtalelser_overskrift, label: "Udtalelser · Overskrift", widget: string }
          - name: udtalelser
