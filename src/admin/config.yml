          - { name: omlotte_billede_alt, label: "Om Lotte-afsnittet · Hvad ser man på billedet?", widget: string, hint: "Læses højt for blinde og bruges af Google i stedet for billedet. Beskriv hvad man SER, ikke stemningen." }
